# =============================================================================
# Base options
# =============================================================================

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"
set -g default-shell /usr/bin/zsh
set -s escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g mode-keys vi
set -g set-titles off
set -g allow-passthrough on

# Window names must remain fixed because tmux-go finds windows by name.
setw -g automatic-rename off

# =============================================================================
# Keybindings
#
# Super is handled by Sway. Alt (M-) is handled directly by tmux.
# =============================================================================

unbind C-b
set -g prefix M-Space
bind M-Space send-prefix

# Create panes in the current pane's directory.
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-b split-window -v -c "#{pane_current_path}"

# Create a separate zsh window only when explicitly needed.
bind -n M-Enter new-window -c "#{pane_current_path}"

# Pane navigation.
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-Q kill-pane
bind -n M-f resize-pane -Z

# Enter tmux scrollback / copy mode.
bind -n M-c copy-mode

# In copy mode:
# v starts a selection.
# y copies it to the Wayland clipboard and exits copy mode.
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# Resize panes by five terminal cells.
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Window navigation.
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-i previous-window
bind -n M-o next-window

# =============================================================================
# Status bar
# =============================================================================

set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default,fg=#d8cfd8"
set -g status-left ""
set -g status-right-length 100
set -g status-right "#(mpc current 2>/dev/null) "
set -g status-interval 2

# =============================================================================
# Window and pane styling
# =============================================================================

setw -g window-status-separator " "
setw -g window-status-format "#[fg=#d8cfd8,bg=#313131] #I #[fg=#d8cfd8,bg=#383838] #W "
setw -g window-status-current-format "#[fg=#101010,bg=#de7484,bold] #I #[fg=#e1e1db,bg=#313131,bold] #W "
setw -g window-status-bell-style "fg=#ffffff,bg=#db3d3f,bold"

set -g pane-border-style "fg=#313131"
set -g pane-active-border-style "fg=#de7484"
