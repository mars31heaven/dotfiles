# --- Video & Hardware Acceleration ---
vo=gpu                        # Use high-performance GPU video output API
gpu-api=opengl                # Modern graphics backend (switch to 'opengl' if you have old Intel hardware)
hwdec=auto-safe               # Automatically choose the safest hardware acceleration method
hwdec-codecs=all              # Enable hardware decoding for all supported formats

# --- Audio Setup (Hi-Fi PipeWire Optimization) ---
ao=pipewire                   # Force MPV to use modern PipeWire audio natively
audio-channels=stereo         # Enforce clean stereo mix down (great for headphones/DACs)
audio-file-auto=fuzzy         # Automatically detect and load external subtitle/audio files

# --- Display & Wayland Fixes ---
gpu-context=wayland           # Lock MPV into native Wayland mode (bypasses XWayland completely)
video-sync=display-resample   # Sync video frames perfectly to your screen refresh rate (zero stuttering)
interpolation=yes             # Smooths out frame drops natively

# --- Look & Feel (Minimalist / Window Manager Style) ---
cursor-autohide=1000          # Hide the mouse cursor after 1 second of inactivity
osc=yes                       # Keep the simple, lightweight on-screen controller UI

term-osd-bar
term-osd-bar-chars="[->-]"
ytdl-format="bestvideo[height<=?1080]+bestaudio/best"
slang="en,pt,pt-en,es"
sub-auto="fuzzy"
screenshot-format="png"

sub-blur=4
sub-font="Clear Sans"
sub-font-size=60
sub-color="#FFFFFF00"
sub-border-color="#FF262626"
sub-border-size=3.2
sub-shadow-offset=1
sub-shadow-color="#33000000"
sub-spacing=0.5
